<template>
    <lightning-card title="Vet Daily Appointments" icon-name="standard:appointment">
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <lightning-input
                type="date"
                label="Select date"
                value={selectedDate}
                onchange={handleDateChange}>
            </lightning-input>
        </div>

        <template if:true={hasAppointments}>
            <lightning-datatable
                key-field="Id"
                data={appointments}
                columns={columns}
                hide-checkbox-column="true">
            </lightning-datatable>
        </template>

        <template if:false={hasAppointments}>
            <template if:false={errorMessage}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    No appointments found for the selected date.
                </div>
            </template>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-p-around_medium slds-text-color_error">
                {errorMessage}
            </div>
        </template>
    </lightning-card>
</template>
