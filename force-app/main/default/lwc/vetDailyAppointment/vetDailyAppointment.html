<template>
    <lightning-card title="Agenda Veterinária Diária" icon-name="standard:service_appointment">
        <div slot="actions">
            <lightning-button label="Novo Agendamento" onclick={openModal} variant="brand" icon-name="utility:add"></lightning-button>
        </div>

        <div class="slds-var-m-around_medium">
            <template if:true={appointments.length}>
                <lightning-datatable
                    key-field="Id"
                    data={appointments}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>
            
            <template if:false={appointments.length}>
                <div class="slds-align_absolute-center slds-var-p-around_large">
                    <p class="slds-text-heading_small slds-text-color_weak">Sem agendamentos clínicos para o dia de hoje.</p>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Modal SLDS para Criação de Registros -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Fechar" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Novo Agendamento Diário</h2>
                </header>
                
                <div class="slds-modal__content slds-var-p-around_medium">
                    <!-- Gerenciamento automático de FLS, regras de validação e obrigatoriedade -->
                    <lightning-record-form
                        object-api-name={objectApiName}
                        fields={fields}
                        columns="2"
                        onsuccess={handleSuccess}
                        oncancel={closeModal}>
                    </lightning-record-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
